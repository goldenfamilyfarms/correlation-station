name: Deploy Demo to AWS EKS

on:
  push:
    branches:
      - demo
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: correlation-station-demo
  ECR_REPOSITORY: correlation-station-demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - correlation-engine
          - correlation-gateway
          - arda-demo
          - beorn-demo
          - palantir-demo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Determine Dockerfile path based on service
          case "${{ matrix.service }}" in
            correlation-engine)
              DOCKERFILE_PATH="seefa-om/correlation-engine/Dockerfile"
              BUILD_CONTEXT="seefa-om/correlation-engine"
              ;;
            correlation-gateway)
              DOCKERFILE_PATH="seefa-om/correlation-gateway/Dockerfile"
              BUILD_CONTEXT="seefa-om/correlation-gateway"
              ;;
            arda-demo)
              DOCKERFILE_PATH="seefa-om/sense-apps/arda/Dockerfile"
              BUILD_CONTEXT="seefa-om/sense-apps/arda"
              ;;
            beorn-demo)
              DOCKERFILE_PATH="seefa-om/sense-apps/beorn/Dockerfile"
              BUILD_CONTEXT="seefa-om/sense-apps/beorn"
              ;;
            palantir-demo)
              DOCKERFILE_PATH="seefa-om/sense-apps/palantir/Dockerfile"
              BUILD_CONTEXT="seefa-om/sense-apps/palantir"
              ;;
          esac

          echo "Building ${{ matrix.service }} from $DOCKERFILE_PATH"

          docker buildx build \
            --platform linux/amd64 \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY/${{ matrix.service }}:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY/${{ matrix.service }}:latest \
            --file $DOCKERFILE_PATH \
            --push \
            $BUILD_CONTEXT

      - name: Image digest
        run: echo "Image pushed to ECR with tag ${{ github.sha }}"

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update Kubernetes manifests with ECR registry
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Replace placeholder with actual ECR registry in all manifest files
          find k8s/demo -name "*.yaml" -type f -exec sed -i "s|<ECR_REGISTRY>|$ECR_REGISTRY|g" {} \;

          echo "Updated manifests:"
          cat k8s/demo/20-correlation-engine.yaml | grep image:

      - name: Upload updated manifests
        uses: actions/upload-artifact@v4
        with:
          name: k8s-manifests
          path: k8s/demo/

  deploy-to-eks:
    needs: update-manifests
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://demo.correlation-station.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download manifests
        uses: actions/download-artifact@v4
        with:
          name: k8s-manifests
          path: k8s/demo/

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Deploy to EKS
        run: |
          echo "Deploying to EKS cluster: $EKS_CLUSTER_NAME"

          # Apply namespace first
          kubectl apply -f k8s/demo/00-namespace.yaml

          # Apply ConfigMap
          kubectl apply -f k8s/demo/40-configmap.yaml

          # Deploy Redis
          kubectl apply -f k8s/demo/10-redis.yaml

          # Deploy Correlation Engine and Gateway
          kubectl apply -f k8s/demo/20-correlation-engine.yaml
          kubectl apply -f k8s/demo/21-correlation-gateway.yaml

          # Deploy Sense apps
          kubectl apply -f k8s/demo/30-arda-demo.yaml
          kubectl apply -f k8s/demo/31-beorn-demo.yaml
          kubectl apply -f k8s/demo/32-palantir-demo.yaml

          # Deploy Ingress
          kubectl apply -f k8s/demo/50-ingress.yaml

      - name: Wait for rollout
        run: |
          echo "Waiting for deployments to be ready..."

          kubectl rollout status deployment/redis-demo -n demo --timeout=5m
          kubectl rollout status deployment/correlation-engine -n demo --timeout=5m
          kubectl rollout status deployment/correlation-gateway -n demo --timeout=5m
          kubectl rollout status deployment/arda-demo -n demo --timeout=5m
          kubectl rollout status deployment/beorn-demo -n demo --timeout=5m
          kubectl rollout status deployment/palantir-demo -n demo --timeout=5m

      - name: Verify deployment
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n demo

          echo ""
          echo "=== Pods Status ==="
          kubectl get pods -n demo

          echo ""
          echo "=== Services ==="
          kubectl get svc -n demo

          echo ""
          echo "=== Ingress ==="
          kubectl get ingress -n demo

      - name: Health check
        run: |
          echo "Running health checks..."

          # Get LoadBalancer URL for correlation-engine
          ENGINE_URL=$(kubectl get svc correlation-engine -n demo -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          if [ -n "$ENGINE_URL" ]; then
            echo "Correlation Engine URL: http://$ENGINE_URL:8080"

            # Wait for LoadBalancer to be ready
            sleep 30

            # Health check
            curl -f http://$ENGINE_URL:8080/health || echo "Health check failed (might need more time for LB DNS propagation)"
          else
            echo "LoadBalancer URL not yet available"
          fi

      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Demo" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** $EKS_CLUSTER_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** $AWS_REGION" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Deployed" >> $GITHUB_STEP_SUMMARY
          kubectl get svc -n demo | tail -n +2 | while read line; do
            echo "- $line" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Ingress URL" >> $GITHUB_STEP_SUMMARY
          echo "https://demo.correlation-station.example.com" >> $GITHUB_STEP_SUMMARY

  post-deployment-tests:
    needs: deploy-to-eks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."

          # Get service endpoints
          ENGINE_SVC=$(kubectl get svc correlation-engine -n demo -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          GATEWAY_SVC=$(kubectl get svc correlation-gateway -n demo -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          echo "Engine endpoint: $ENGINE_SVC"
          echo "Gateway endpoint: $GATEWAY_SVC"

          # Test correlation-engine health
          kubectl run smoke-test-engine --rm -i --restart=Never --image=curlimages/curl -n demo -- \
            curl -f http://correlation-engine:8080/health || echo "Engine health check failed"

          # Test correlation-gateway health
          kubectl run smoke-test-gateway --rm -i --restart=Never --image=curlimages/curl -n demo -- \
            curl -f http://correlation-gateway:8081/health || echo "Gateway health check failed"

          # Test ARDA
          kubectl run smoke-test-arda --rm -i --restart=Never --image=curlimages/curl -n demo -- \
            curl -f http://arda-demo:8000/health || echo "ARDA health check failed"

      - name: Test DEMO_MODE
        run: |
          echo "Verifying DEMO_MODE is active..."

          # Check environment variable in one of the pods
          POD=$(kubectl get pod -n demo -l app=correlation-engine -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n demo $POD -- env | grep DEMO_MODE=true && echo "✓ DEMO_MODE confirmed" || echo "✗ DEMO_MODE not set"
