---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: correlation-station-demo
  namespace: demo
  labels:
    app: correlation-station
    environment: demo
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - demo.correlation-station.example.com
    secretName: correlation-station-demo-tls
  rules:
  - host: demo.correlation-station.example.com
    http:
      paths:
      # Correlation Engine API
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: correlation-engine
            port:
              number: 8080

      # Correlation Gateway
      - path: /gateway
        pathType: Prefix
        backend:
          service:
            name: correlation-gateway
            port:
              number: 8081

      # ARDA Sense App
      - path: /arda
        pathType: Prefix
        backend:
          service:
            name: arda-demo
            port:
              number: 8000

      # BEORN Sense App
      - path: /beorn
        pathType: Prefix
        backend:
          service:
            name: beorn-demo
            port:
              number: 8001

      # PALANTIR Sense App
      - path: /palantir
        pathType: Prefix
        backend:
          service:
            name: palantir-demo
            port:
              number: 8002

      # Default: Correlation Engine (frontend would go here)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: correlation-engine
            port:
              number: 8080
