[pytest]
# Pytest configuration for Correlation Station test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = seefa-om/tests

# Markers
markers =
    e2e: End-to-end integration tests
    unit: Unit tests
    slow: Tests that take a long time to run
    otel: OpenTelemetry instrumentation tests
    seca: SECA review automation tests
    learning: Learning portal tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Console output
console_output_style = progress

# Logging
log_cli = false
log_cli_level = INFO
log_file = pytest.log
log_file_level = DEBUG

# Coverage (if pytest-cov is installed)
# addopts = --cov=seefa-om --cov-report=html --cov-report=term

# Timeout for tests (if pytest-timeout is installed)
# timeout = 300

# Asyncio mode (if pytest-asyncio is installed)
asyncio_mode = auto
