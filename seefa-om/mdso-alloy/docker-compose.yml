
services:
  alloy:
    image: grafana/alloy:latest
    container_name: alloy-mdso
    restart: unless-stopped

    volumes:
      # Alloy configuration
      - ./config.alloy:/etc/alloy/config.alloy:ro

      # Mount syslog directories (read-only)
      - /var/log/ciena:/var/log/ciena:ro
      - /bp2/log:/bp2/log:ro

      # Script plan logs
      - /opt/ciena/bp2/scriptplan_2.4.8-24.08-1_1/log:/opt/ciena/bp2/scriptplan_2.4.8-24.08-1_1/log:ro

      # Elasticsearch logs
      - /opt/ciena/bp2/elasticsearch_24.08-10-es8.15.0_1/log:/opt/ciena/bp2/elasticsearch_24.08-10-es8.15.0_1/log:ro
      - /opt/ciena/bp2/gvselasticsearch_24.08-4-es8.12.1_2/log:/opt/ciena/bp2/gvselasticsearch_24.08-4-es8.12.1_2/log:ro

      # BPO Core logs
      - /opt/ciena/bp2/bpocore_4.9.3-13365-7b757e187d_1/log:/opt/ciena/bp2/bpocore_4.9.3-13365-7b757e187d_1/log:ro
      - /opt/ciena/bp2/bpocore_4.9.3-13365-7b757e187d_1/log/plan-log:/opt/ciena/bp2/bpocore_4.9.3-13365-7b757e187d_1/log/plan-log:ro

      # BPO Marketer logs
      - /opt/ciena/bp2/bpmarketra_1910.0.0-5_0/log:/opt/ciena/bp2/bpmarketra_1910.0.0-5_0/log:ro

      # Prometheus logs
      - /opt/ciena/bp2/prometheus_3.4.39_0:/opt/ciena/bp2/prometheus_3.4.39_0:ro

      # BPO RA (Resource Adapters) logs
      - /opt/ciena/bp2/bpraadva_6.5.1.v.23.12.01_1/log:/opt/ciena/bp2/bpraadva_6.5.1.v.23.12.01_1/log:ro
      - /opt/ciena/bp2/bpraadva_6.5.1.v.23.12.01_4/log:/opt/ciena/bp2/bpraadva_6.5.1.v.23.12.01_4/log:ro
      - /opt/ciena/bp2/bpracisco_6.5.4.v.23.12.02_2/log:/opt/ciena/bp2/bpracisco_6.5.4.v.23.12.02_2/log:ro
      - /opt/ciena/bp2/bprajuniper_6.5.1.v.23.12.01_2/log:/opt/ciena/bp2/bprajuniper_6.5.1.v.23.12.01_2/log:ro
      - /opt/ciena/bp2/bprajuniper_6.5.1.v.23.12.01_5/log:/opt/ciena/bp2/bprajuniper_6.5.1.v.23.12.01_5/log:ro
      - /opt/ciena/bp2/bprarad_6.5.2.v.21.10.06_2/log:/opt/ciena/bp2/bprarad_6.5.2.v.21.10.06_2/log:ro
      - /opt/ciena/bp2/bprarphy_6.4.4.v.21.10.4_0/log:/opt/ciena/bp2/bprarphy_6.4.4.v.21.10.4_0/log:ro

      # Host metrics logs
      - /opt/ciena/bp2/host-metrics_1.0.24_0/log:/opt/ciena/bp2/host-metrics_1.0.24_0/log:ro

      # Kafka logs
      - /opt/ciena/bp2/kafka_24.8.3-k3.6.1_0/log:/opt/ciena/bp2/kafka_24.8.3-k3.6.1_0/log:ro

      # RA Control logs
      - /opt/ciena/bp2/ractrl_6.9.6_1/log:/opt/ciena/bp2/ractrl_6.9.6_1/log:ro

      # RA Access logs
      - /opt/ciena/bp2/raccess_6.1.1_0/log:/opt/ciena/bp2/raccess_6.1.1_0/log:ro

      # Trace log directory (for isolated containers that write traces to file)
      - /opt/ciena/bp2/alloy-collector:/opt/ciena/bp2/alloy-collector:ro

    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data

    ports:
      - "12345:12345"  # Alloy UI

    # Use host network for direct access to Meta server
    network_mode: host

    # Run as root to access log files (adjust if needed)
    user: root

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:12345/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s