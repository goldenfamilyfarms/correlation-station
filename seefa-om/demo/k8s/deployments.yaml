---
# OTEL Collector (simple)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.84.0
          command: ["/otelcol-contrib","--config","/conf/otel-collector-config.yaml"]
          volumeMounts:
            - name: otel-config
              mountPath: /conf
          ports:
            - containerPort: 4318 # OTLP HTTP
            - containerPort: 55681
      volumes:
        - name: otel-config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: demo
spec:
  selector:
    app: otel-collector
  ports:
    - port: 4318
      targetPort: 4318
    - port: 55681
      targetPort: 55681
  type: ClusterIP
---
# Expose a public demo ingress (assumes ingress controller installed)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress
  namespace: demo
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: net-auto-olly.gff.org
      http:
        paths:
          - path: /correlation-engine
            pathType: Prefix
            backend:
              service:
                name: correlation-engine
                port:
                  number: 8080
          - path: /mdso
            pathType: Prefix
            backend:
              service:
                name: mdso-mock
                port:
                  number: 5001
          - path: /sense/provision
            pathType: Prefix
            backend:
              service:
                name: sense-provisioning
                port:
                  number: 5002
          - path: /sense/compliance
            pathType: Prefix
            backend:
              service:
                name: sense-compliance
                port:
                  number: 5003
          - path: /sense/disconnect
            pathType: Prefix
            backend:
              service:
                name: sense-disconnect
                port:
                  number: 5004
