apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdso-mock
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mdso-mock
  template:
    metadata:
      labels:
        app: mdso-mock
    spec:
      containers:
        - name: mdso-mock
          image: ghcr.io/demo/mdso-mock:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet:
              path: /tron/api/v1/tokens
              port: 5001
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mdso-mock
  namespace: demo
spec:
  selector:
    app: mdso-mock
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP
---
