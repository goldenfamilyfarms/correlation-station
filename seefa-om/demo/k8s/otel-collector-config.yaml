receivers:
  otlp:
    protocols:
      http:
      grpc:

processors:
  batch:
exporters:
  logging:
    loglevel: info
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"
    labels:
      job: "otel-collector"
  otlp/tempo:
    endpoint: "tempo:4318"
    insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: ["otlp/tempo","logging"]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: ["loki","logging"]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: ["logging"]

  telemetry:
    metrics:
      address: 0.0.0.0:8888
