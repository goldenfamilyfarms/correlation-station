[global]
# Artifactory PyPI repository with authentication
# Replace <USER_EMAIL> and <PASSWORD> with credentials for your package index.
# For the public demo these point to a neutral placeholder host.
index-url = https://<USER_EMAIL>:<PASSWORD>@artifactory.example.com/artifactory/api/pypi/pypi-local/simple

# Fallback to public PyPI if package not found in Artifactory
extra-index-url = https://pypi.org/simple

# Trust demo Artifactory host (placeholder)
trusted-host = artifactory.example.com

[install]
# Don't prompt for input during install
no-input = yes

# Timeout for network operations (seconds)
timeout = 60