# GitLab CI/CD Pipeline for Correlation Station
# Blueprint Feature 6: GitLab CI/CD & Artifactory Integration

# Pipeline stages
stages:
  - build
  - test
  - push
  - deploy

# Global variables
variables:
  ARTIFACTORY_URL: "https://artifactory.example.com"
  ARTIFACTORY_REPO: "docker-local"
  DOCKER_REGISTRY: "${ARTIFACTORY_URL}/${ARTIFACTORY_REPO}"
  GIT_DEPTH: 5

# Docker build template
.docker_build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $ARTIFACTORY_USER -p $ARTIFACTORY_TOKEN $ARTIFACTORY_URL
  script:
    - |
      # Build image
      IMAGE_TAG="${DOCKER_REGISTRY}/${CI_PROJECT_NAME}/${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      LATEST_TAG="${DOCKER_REGISTRY}/${CI_PROJECT_NAME}/${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}-latest"

      docker build \
        -t $IMAGE_TAG \
        -t $LATEST_TAG \
        -f $DOCKERFILE_PATH \
        $BUILD_CONTEXT

      # Push images
      docker push $IMAGE_TAG
      docker push $LATEST_TAG

      echo "Built and pushed: $IMAGE_TAG"

# ===== BUILD STAGE =====

build:correlation-engine:
  extends: .docker_build
  variables:
    IMAGE_NAME: "correlation-engine"
    DOCKERFILE_PATH: "seefa-om/correlation-engine/Dockerfile"
    BUILD_CONTEXT: "seefa-om/correlation-engine"
  only:
    - main
    - develop
    - tags

build:correlation-gateway:
  extends: .docker_build
  variables:
    IMAGE_NAME: "correlation-gateway"
    DOCKERFILE_PATH: "seefa-om/correlation-gateway/Dockerfile"
    BUILD_CONTEXT: "seefa-om/correlation-gateway"
  only:
    - main
    - develop
    - tags

build:frontend:
  extends: .docker_build
  variables:
    IMAGE_NAME: "correlation-station-frontend"
    DOCKERFILE_PATH: "seefa-om/frontend/Dockerfile"
    BUILD_CONTEXT: "seefa-om/frontend"
  only:
    - main
    - develop
    - tags

# ===== TEST STAGE =====

test:correlation-engine:
  stage: test
  image: python:3.11-slim
  before_script:
    - cd seefa-om/correlation-engine
    - pip install -r requirements.txt
    - pip install pytest pytest-asyncio pytest-cov
  script:
    - pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: seefa-om/correlation-engine/coverage.xml
  only:
    - main
    - develop
    - merge_requests

test:frontend:
  stage: test
  image: node:20-alpine
  before_script:
    - cd seefa-om/frontend
    - npm ci
  script:
    - npm run lint
    - npm run test
  only:
    - main
    - develop
    - merge_requests

# ===== PUSH STAGE (Alloy Config) =====

push:alloy-config:
  stage: push
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      # Build Alloy config tarball
      cd seefa-om/mdso-alloy
      tar czf alloy-config-${CI_COMMIT_SHORT_SHA}.tar.gz config/

      # Upload to Artifactory
      curl -u $ARTIFACTORY_USER:$ARTIFACTORY_TOKEN \
        -T alloy-config-${CI_COMMIT_SHORT_SHA}.tar.gz \
        "${ARTIFACTORY_URL}/generic-local/alloy-config/alloy-config-${CI_COMMIT_SHORT_SHA}.tar.gz"

      echo "Uploaded Alloy config to Artifactory"
  artifacts:
    paths:
      - seefa-om/mdso-alloy/alloy-config-${CI_COMMIT_SHORT_SHA}.tar.gz
    expire_in: 30 days
  only:
    - main
    - tags

# ===== DEPLOY STAGE =====

deploy:meta-server:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $META_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - |
      # Deploy Correlation Engine
      ssh $META_SERVER_USER@$META_SERVER_HOST << 'EOF'
        set -e
        cd /opt/correlation-station

        # Pull latest images
        docker pull ${DOCKER_REGISTRY}/${CI_PROJECT_NAME}/correlation-engine:${CI_COMMIT_REF_SLUG}-latest
        docker pull ${DOCKER_REGISTRY}/${CI_PROJECT_NAME}/correlation-gateway:${CI_COMMIT_REF_SLUG}-latest

        # Restart services using docker-compose
        docker-compose -f docker-compose.prod.yml pull
        docker-compose -f docker-compose.prod.yml up -d correlation-engine correlation-gateway

        # Health check
        sleep 10
        curl -f http://localhost:8080/health || exit 1

        echo "Deployment successful"
      EOF
  environment:
    name: production/meta
    url: http://159.56.4.94:8080
  only:
    - main
  when: manual  # Require manual approval for production

deploy:frontend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $FRONTEND_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - |
      # Deploy Frontend
      ssh $FRONTEND_SERVER_USER@$FRONTEND_SERVER_HOST << 'EOF'
        set -e
        cd /opt/correlation-station-frontend

        # Pull latest image
        docker pull ${DOCKER_REGISTRY}/${CI_PROJECT_NAME}/correlation-station-frontend:${CI_COMMIT_REF_SLUG}-latest

        # Restart frontend container
        docker-compose pull frontend
        docker-compose up -d frontend

        # Health check
        sleep 5
        curl -f http://localhost:3000 || exit 1

        echo "Frontend deployment successful"
      EOF
  environment:
    name: production/frontend
    url: http://austx-mdso-logs-02.chtrse.com
  only:
    - main
  when: manual

deploy:alloy-config:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $MDSO_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - |
      # Download Alloy config from Artifactory
      curl -u $ARTIFACTORY_USER:$ARTIFACTORY_TOKEN \
        -o alloy-config.tar.gz \
        "${ARTIFACTORY_URL}/generic-local/alloy-config/alloy-config-${CI_COMMIT_SHORT_SHA}.tar.gz"

      # Deploy to MDSO server
      scp alloy-config.tar.gz $MDSO_SERVER_USER@$MDSO_SERVER_HOST:/tmp/

      ssh $MDSO_SERVER_USER@$MDSO_SERVER_HOST << 'EOF'
        set -e
        cd /etc/grafana-alloy

        # Backup current config
        tar czf config-backup-$(date +%Y%m%d-%H%M%S).tar.gz config/

        # Extract new config
        tar xzf /tmp/alloy-config.tar.gz -C /etc/grafana-alloy

        # Reload Alloy
        systemctl reload grafana-alloy

        # Verify Alloy is running
        systemctl status grafana-alloy

        echo "Alloy config deployed and reloaded"
      EOF
  environment:
    name: production/mdso-alloy
  only:
    - main
  when: manual

# ===== VERSION TAGGING =====

tag:version:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - |
      # Create semantic version tag
      VERSION=$(cat VERSION)
      git tag -a "v${VERSION}" -m "Release v${VERSION}"
      git push origin "v${VERSION}"

      echo "Tagged version: v${VERSION}"
  only:
    - main
  when: manual

# ===== CLEANUP =====

cleanup:old-images:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      # Delete images older than 30 days from Artifactory
      # (Artifactory REST API example)
      THIRTY_DAYS_AGO=$(date -d '30 days ago' +%s)

      curl -u $ARTIFACTORY_USER:$ARTIFACTORY_TOKEN \
        "${ARTIFACTORY_URL}/api/storage/${ARTIFACTORY_REPO}/${CI_PROJECT_NAME}" \
        | jq -r '.children[].uri' \
        | while read image; do
          # Check image age and delete if old
          # (Implementation depends on Artifactory setup)
          echo "Checking $image..."
        done
  only:
    - schedules
  when: manual
