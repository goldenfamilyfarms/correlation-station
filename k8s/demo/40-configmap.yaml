---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
  namespace: demo
  labels:
    app: correlation-station
    environment: demo
data:
  # Demo mode flag
  DEMO_MODE: "true"

  # Redis configuration
  REDIS_HOST: "redis-demo"
  REDIS_PORT: "6379"

  # Correlation Engine configuration
  CORRELATION_ENGINE_URL: "http://correlation-engine:8080"
  CORRELATION_GATEWAY_URL: "http://correlation-gateway:8081"

  # Observability endpoints
  LOKI_URL: "http://loki:3100"
  TEMPO_GRPC_ENDPOINT: "tempo:4317"
  PROMETHEUS_URL: "http://prometheus:9090"

  # Feature flags
  ENABLE_AUTH: "false"
  ENABLE_TELEMETRY: "true"
  ENABLE_SECA_AUTOMATION: "true"
  ENABLE_LEARNING_PORTAL: "true"

  # API configuration
  API_RATE_LIMIT: "100/minute"

  # Deployment environment
  DEPLOYMENT_ENVIRONMENT: "demo"
