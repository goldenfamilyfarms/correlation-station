---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: correlation-engine
  namespace: demo
  labels:
    app: correlation-engine
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: correlation-engine
  template:
    metadata:
      labels:
        app: correlation-engine
        component: backend
    spec:
      containers:
      - name: correlation-engine
        image: <ECR_REGISTRY>/correlation-station-demo/correlation-engine:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DEMO_MODE
          value: "true"
        - name: REDIS_HOST
          value: redis-demo
        - name: REDIS_PORT
          value: "6379"
        - name: LOKI_URL
          value: http://loki:3100
        - name: TEMPO_GRPC_ENDPOINT
          value: tempo:4317
        - name: PROMETHEUS_URL
          value: http://prometheus:9090
        - name: ENABLE_AUTH
          value: "false"
        - name: ENABLE_TELEMETRY
          value: "true"
        - name: ENABLE_SECA_AUTOMATION
          value: "true"
        - name: ENABLE_LEARNING_PORTAL
          value: "true"
        - name: API_RATE_LIMIT
          value: "100/minute"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: correlation-engine
  namespace: demo
  labels:
    app: correlation-engine
    component: backend
spec:
  selector:
    app: correlation-engine
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: LoadBalancer
