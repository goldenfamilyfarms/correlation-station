---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: correlation-gateway
  namespace: demo
  labels:
    app: correlation-gateway
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: correlation-gateway
  template:
    metadata:
      labels:
        app: correlation-gateway
        component: gateway
    spec:
      containers:
      - name: correlation-gateway
        image: <ECR_REGISTRY>/correlation-station-demo/correlation-gateway:latest
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: DEMO_MODE
          value: "true"
        - name: CORRELATION_ENGINE_URL
          value: http://correlation-engine:8080
        - name: REDIS_HOST
          value: redis-demo
        - name: REDIS_PORT
          value: "6379"
        - name: ENABLE_TELEMETRY
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: correlation-gateway
  namespace: demo
  labels:
    app: correlation-gateway
    component: gateway
spec:
  selector:
    app: correlation-gateway
  ports:
  - port: 8081
    targetPort: 8081
    name: http
  type: LoadBalancer
