---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arda-demo
  namespace: demo
  labels:
    app: arda-demo
    component: sense-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arda-demo
  template:
    metadata:
      labels:
        app: arda-demo
        component: sense-app
    spec:
      containers:
      - name: arda
        image: <ECR_REGISTRY>/correlation-station-demo/arda-demo:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DEMO_MODE
          value: "true"
        - name: SERVICE_NAME
          value: "arda"
        - name: CORRELATION_GATEWAY_URL
          value: http://correlation-gateway:8081
        - name: ENABLE_OTEL
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://correlation-gateway:8081/api/otlp
        - name: OTEL_SERVICE_NAME
          value: "arda"
        - name: DEPLOYMENT_ENVIRONMENT
          value: "demo"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: arda-demo
  namespace: demo
  labels:
    app: arda-demo
    component: sense-app
spec:
  selector:
    app: arda-demo
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: LoadBalancer
