---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-demo
  namespace: demo
  labels:
    app: redis-demo
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-demo
  template:
    metadata:
      labels:
        app: redis-demo
        component: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        args:
          - redis-server
          - --maxmemory
          - 512mb
          - --maxmemory-policy
          - allkeys-lru
          - --save
          - ""
          - --appendonly
          - "no"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-demo
  namespace: demo
  labels:
    app: redis-demo
    component: cache
spec:
  selector:
    app: redis-demo
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  type: ClusterIP
